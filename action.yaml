author: Cédric Belin
name: Setup Ant
description: Set up your GitHub Actions workflow with a specific version of Apache Ant.

branding:
  color: red
  icon: download

inputs:
  optional-tasks:
    description: Whether to fetch the external libraries required by Ant optional tasks.
    default: false
    required: false
  version:
    description: The version constraint of the Apache Ant binary.
    default: Latest
    required: false

runs:
  using: composite
  steps:
    - run: |
        Invoke-WebRequest "https://aka.ms/install-powershell.ps1" -OutFile Install-PowerShell.ps1
        ./Install-PowerShell.ps1
        Add-Content $Env:GITHUB_PATH ($IsWindows ? "$Env:LOCALAPPDATA\Microsoft\powershell" : "~/.powershell")
      shell: pwsh
    - run: Add-Content $Env:GITHUB_PATH ${{github.action_path}}
      shell: pwsh
    - run: Action.ps1
      shell: pwsh
      env:
        SETUP_ANT_OPTIONAL_TASKS: ${{inputs.optional-tasks}}
        SETUP_ANT_VERSION: ${{inputs.version}}
